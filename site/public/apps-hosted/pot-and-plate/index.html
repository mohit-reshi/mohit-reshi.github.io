<script>
(function () {
'use strict';
/* ---- core/base.js ---- */
// Small shared helpers: escaping, ids, tolerant number reading, local-date keys and name matching.

function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;'); }
function uid(prefix) { return (prefix || 'id') + '-' + Math.random().toString(36).slice(2, 8) + Date.now().toString(36).slice(-3); }
function norm(s) { return String(s == null ? '' : s).replace(/\r\n?/g, '\n').replace(/[ \t  ]+/g, ' ').trim(); }
const r1 = (n) => Math.round((n + Number.EPSILON) * 10) / 10;
const r0 = (n) => Math.round(n);
const clamp = (n, lo, hi) => Math.min(hi, Math.max(lo, n));
/** 1234.5 -> "1,235": always the same format, whatever the browser locale is. */
const fmt0 = (n) => String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
const fmt1 = (n) => { const v = r1(n); return String(Number.isInteger(v) ? v : v.toFixed(1)); };

/** Reads a number from messy text: "~1,000", "12,5", "350 kcal", "−2". Returns null when there is no usable number. */
function num(s) {
  if (typeof s === 'number') return isFinite(s) ? s : null;
  let t = String(s == null ? '' : s).replace(/[  \s]/g, '').replace(/^[~≈]+/, '').replace(/−/g, '-');
  if (!t || /\[/.test(t)) return null;
  t = t.replace(/[a-zA-Z%]+$/, '');
  if (/^-?\d{1,3}(,\d{3})+(\.\d+)?$/.test(t)) t = t.replace(/,/g, ''); else t = t.replace(',', '.');
  if (!/^-?(\d+\.?\d*|\.\d+)$/.test(t)) return null;
  const v = parseFloat(t);
  return isFinite(v) ? v : null;
}

// ---------- dates (always local time, as YYYY-MM-DD keys) ----------
const p2 = (n) => String(n).padStart(2, '0');
const dayKey = (d) => d.getFullYear() + '-' + p2(d.getMonth() + 1) + '-' + p2(d.getDate());
const parseKey = (k) => { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d, 12, 0, 0); };
const addDays = (k, n) => { const d = parseKey(k); d.setDate(d.getDate() + n); return dayKey(d); };
/** The day an eating moment belongs to. With a 4 am day start, 01:30 still counts for the evening before. */
const dayKeyFor = (now, startHour) => dayKey(new Date(now.getTime() - (startHour || 0) * 3600e3));
const minutesOf = (d) => d.getHours() * 60 + d.getMinutes();
const timeLabel = (m) => p2(Math.floor(m / 60)) + ':' + p2(m % 60);
const MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
const DOW = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
const dowOf = (k) => parseKey(k).getDay();
const dowName = (i) => DOW[i];
const dateLabel = (k) => { const d = parseKey(k); return DOW[d.getDay()] + ' ' + d.getDate() + ' ' + MON[d.getMonth()]; };
const dateLong = (k) => { const d = parseKey(k); return DOW[d.getDay()] + ', ' + d.getDate() + ' ' + MON[d.getMonth()] + ' ' + d.getFullYear(); };
const dateShort = (k) => { const d = parseKey(k); return d.getDate() + ' ' + MON[d.getMonth()] + ' ' + d.getFullYear(); };
const daysBetween = (a, b) => Math.round((parseKey(b) - parseKey(a)) / 864e5);

// ---------- names ----------
const slug = (s) => norm(s).toLowerCase().replace(/&/g, ' and ').replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 48) || 'x';
const STOP = new Set(['a', 'an', 'the', 'of', 'and', 'with', 'in', 'to', 'fresh', 'whole', 'plain']);
const words = (s) => norm(s).toLowerCase().replace(/[^a-z0-9ऀ-ॿ ]+/g, ' ').split(/\s+/).filter((w) => w && !STOP.has(w));
/** 0..1: how well two names match. Handles word order, plurals and a missing "raw"/"cooked". */
function similarity(a, b) {
  const wa = words(a).map(stem), wb = words(b).map(stem);
  if (!wa.length || !wb.length) return 0;
  const sa = new Set(wa), sb = new Set(wb);
  let hit = 0; sa.forEach((w) => { if (sb.has(w)) hit++; });
  const j = hit / (sa.size + sb.size - hit);
  const contain = hit / Math.min(sa.size, sb.size);
  return Math.max(j, contain * 0.85);

const stem = (w) => w.length > 3 && w.endsWith('s') && !w.endsWith('ss') ? w.slice(0, -1) : w;

/* ---- core/nutri.js ---- */
// Nutrition maths. Values per 100 g are k (kcal), p (protein), c (carbs), f (fat), fi (fibre), all in grams except k.

const zero = () => ({ k: 0, p: 0, c: 0, f: 0, fi: 0 });
const add = (a, b) => ({ k: a.k + b.k, p: a.p + b.p, c: a.c + b.c, f: a.f + b.f, fi: a.fi + b.fi });
const sum = (list) => list.reduce((t, x) => add(t, x), zero());
const scale = (n, g) => { const r = g / 100; return { k: n.k * r, p: n.p * r, c: n.c * r, f: n.f * r, fi: (n.fi || 0) * r }; };

const clean = (n) => ({ k: num(n && n.k) || 0, p: num(n && n.p) || 0, c: num(n && n.c) || 0, f: num(n && n.f) || 0, fi: num(n && n.fi) || 0 });

/** Calories a macro breakdown implies (protein and carbs 4 per g, fat 9). Fibre is already inside carbs. */

/** True when stated calories and macros roughly agree. Catches typos in a label or a pasted recipe. */
function consistent(n, tolerance) {
  const exp = impliedKcal(n), diff = Math.abs(n.k - exp);
  return diff <= Math.max(15, (tolerance || 0.18) * Math.max(n.k, exp));
}

/** Nutrition of one recipe item: it keeps its own per-100 g values, so a recipe never changes when a food is edited later. */
const itemNutrition = (it) => scale(clean(it.n), Math.max(0, num(it.g) || 0));
const mealTotals = (meal) => sum((meal.items || []).map(itemNutrition));
const itemsWeight = (meal) => (meal.items || []).reduce((t, it) => t + Math.max(0, num(it.g) || 0), 0);

/** Cooked weight of the food only: the full pot minus the empty vessel (or the net weight if no vessel was weighed). */

const START = /={2,}\s*MEAL\s*v(\d+)\s*={2,}/i;

    if (cur && END.test(l)) { blocks.push(cur); cur = null; continue; }

/** Log a saved meal: by servings, or by grams from the weighed pot. */

  $$('.seg-btn', sh.el).forEach((b) => b.addEventListener('click', () => { if (b.disabled) return; mode = b.dataset.mode; $$('.seg-btn', sh.el).forEach((x) => x.setAttribute('aria-pressed', x === b)); $('#lm-label', sh.el).textContent = mode === 'grams' ? 'Grams eaten' : 'Servings eaten'; amt.value = mode === 'grams' ? Math.round(gps) : 1; calc(); }));

// Progress: calories against the goal, averages, weight trend, water, weekday pattern and the foods that add the most.


function barChart(days, goal) {
  const W = 640, H = 190, pl = 34, pb = 22, pt = 8; const max = Math.max(goal * 1.25, ...days.map((d) => d.k), 1);
  const bw = (W - pl) / days.length; const y = (v) => pt + (H - pt - pb) * (1 - v / max);
  const bars = days.map((d, i) => d.logged ? '<rect x="' + (pl + i * bw + bw * 0.12).toFixed(1) + '" y="' + y(d.k).toFixed(1) + '" width="' + (bw * 0.76).toFixed(1) + '" height="' + (H - pb - y(d.k)).toFixed(1) + '" rx="2" class="cb"><title>' + esc(dateLabel(d.key) + ': ' + fmt0(d.k) + ' kcal') + '</title></rect>' : '<rect x="' + (pl + i * bw + bw * 0.12).toFixed(1) + '" y="' + (H - pb - 3) + '" width="' + (bw * 0.76).toFixed(1) + '" height="3" class="cb-none"><title>' + esc(dateLabel(d.key) + ': not logged') + '</title></rect>').join('');
  const lab = days.map((d, i) => (days.length <= 14 || i % Math.ceil(days.length / 8) === 0) ? '<text x="' + (pl + i * bw + bw / 2).toFixed(1) + '" y="' + (H - 6) + '" text-anchor="middle" class="ct">' + d.key.slice(8) + '</text>' : '').join('');
  return '<svg viewBox="0 0 ' + W + ' ' + H + '" class="chart" role="img" aria-label="Calories per day for the last ' + days.length + ' days, with the goal of ' + fmt0(goal) + '. Days not logged are shown as a thin line."><line x1="' + pl + '" x2="' + W + '" y1="' + y(goal).toFixed(1) + '" y2="' + y(goal).toFixed(1) + '" class="cg"/><text x="2" y="' + (y(goal) + 4).toFixed(1) + '" class="ct">' + fmt0(goal) + '</text>' + bars + lab + '</svg>';
}
function weightChart(days, trend) {

  const W = 640, H = 170, pl = 40, pb = 20, pt = 8; const all = pts.flatMap((p) => [p.w, p.t]); const lo = Math.min(...all) - 0.3, hi = Math.max(...all) + 0.3; const x = (i) => pl + (W - pl - 6) * (days.length === 1 ? 0 : i / (days.length - 1)); const y = (v) => pt + (H - pt - pb) * (1 - (v - lo) / (hi - lo || 1));

function onChange(e) {

}
function onInput(e) {
