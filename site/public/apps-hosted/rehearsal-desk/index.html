<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rehearsal Desk</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230f5c63'/%3E%3Cpath d='M8 11h16M8 16h16M8 21h10' stroke='%23fff' stroke-width='2.5' stroke-linecap='round'/%3E%3C/svg%3E">
<meta name="description" content="Paste your resume and rehearse the answers you will give: starter answers from your own facts, editable cards, readability checks, job match and a printable resume.">
<style>
:root {
  --bg: #f3efe7; --surface: #fffdf8; --surface2: #ece6da; --ink: #1d2428; --ink2: #4b565c; --line: #d6cfc0;
  --accent: #0f5c63; --accent-ink: #ffffff; --accent-soft: #d7ecec; --green: #1d7a46; --green-soft: #dcf0e2; --warn: #8a5a00; --warn-soft: #f8ecd0; --bad: #a3322a; --bad-soft: #f7dcd8;
  --bar: #fffdf8; --focus: #0b6fb5; --shadow: 0 1px 2px rgba(30, 30, 20, .08), 0 6px 14px rgba(30, 30, 20, .08);
  --topbar-h: 56px;
  --p-blue: #dbe9f8; --p-yellow: #fbf0b8; --p-green: #d9efd5; --p-purple: #e6dcf5; --p-orange: #fbdcbf; --p-slate: #e1e6ea; --p-pink: #f9d9e4; --p-teal: #cdeeea;
  --paper-ink: #1d2428; --on-green: #ffffff; --green-text: #135a2d; --top-bg: #0f5c63; --top-ink: #ffffff; --top-on: rgba(0, 0, 0, .32); --top-hover: rgba(0, 0, 0, .18);
  --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --serif: Georgia, "Times New Roman", serif; --mono: ui-monospace, "Cascadia Code", Consolas, Menlo, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --bg: #14181b; --surface: #1c2226; --surface2: #252d32; --ink: #e8edef; --ink2: #aab6bb; --line: #36444b; --accent: #5cc0c8; --accent-ink: #072326; --accent-soft: #17383b; --green: #5fd08c; --green-soft: #17331f; --warn: #e4b45b; --warn-soft: #382c10; --bad: #f08a80; --bad-soft: #3a1c19; --bar: #1c2226; --focus: #6bb7f0; --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 6px 14px rgba(0, 0, 0, .35);
    --p-blue: #20354a; --p-yellow: #43391a; --p-green: #1f3a26; --p-purple: #35294d; --p-orange: #4a3220; --p-slate: #2a343b; --p-pink: #46283a; --p-teal: #1b3b3a; --paper-ink: #eef1f2; --on-green: #06210f; --green-text: #7fdca2; --top-bg: #0f3b40; --top-ink: #e8f6f7; --top-on: rgba(255, 255, 255, .2); --top-hover: rgba(255, 255, 255, .12); color-scheme: dark; }
}
:root[data-theme="dark"] { --bg: #14181b; --surface: #1c2226; --surface2: #252d32; --ink: #e8edef; --ink2: #aab6bb; --line: #36444b; --accent: #5cc0c8; --accent-ink: #072326; --accent-soft: #17383b; --green: #5fd08c; --green-soft: #17331f; --warn: #e4b45b; --warn-soft: #382c10; --bad: #f08a80; --bad-soft: #3a1c19; --bar: #1c2226; --focus: #6bb7f0; --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 6px 14px rgba(0, 0, 0, .35);
  --p-blue: #20354a; --p-yellow: #43391a; --p-green: #1f3a26; --p-purple: #35294d; --p-orange: #4a3220; --p-slate: #2a343b; --p-pink: #46283a; --p-teal: #1b3b3a; --paper-ink: #eef1f2; --on-green: #06210f; --green-text: #7fdca2; --top-bg: #0f3b40; --top-ink: #e8f6f7; --top-on: rgba(255, 255, 255, .2); --top-hover: rgba(255, 255, 255, .12); color-scheme: dark; }

* { box-sizing: border-box; }
html { scroll-behavior: auto; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.55 var(--font); }
a { color: var(--accent); }
h1, h2, h3, h4 { line-height: 1.2; margin: 0 0 .5em; }
h1 { font-size: clamp(26px, 4vw, 38px); } h2 { font-size: 22px; } h3 { font-size: 16px; } h4 { font-size: 15px; }
p { margin: 0 0 .8em; } ul { margin: 0 0 .8em; padding-left: 1.2em; }
.muted { color: var(--ink2); } .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.skip { position: absolute; left: -999px; } .skip:focus { left: 8px; top: 8px; z-index: 100; background: var(--surface); padding: 8px 12px; border-radius: 6px; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
mark.gap { background: var(--warn-soft); color: var(--warn); border-radius: 3px; padding: 0 3px; font-weight: 600; }

/* top bar */
.topbar { position: sticky; top: 0; z-index: 40; height: var(--topbar-h); display: flex; align-items: center; gap: 14px; padding: 0 18px; background: var(--top-bg); color: var(--top-ink); }
.brand { display: flex; align-items: center; gap: 9px; color: inherit; text-decoration: none; font-weight: 800; letter-spacing: -.01em; white-space: nowrap; font-size: 18px; }
.logo { width: 22px; height: 22px; border-radius: 6px 6px 6px 2px; background: var(--top-ink); display: inline-block; position: relative; }
.logo::after { content: ""; position: absolute; left: 5px; top: 6px; width: 12px; height: 2px; background: var(--top-bg); box-shadow: 0 5px 0 var(--top-bg), 0 10px 0 var(--top-bg); }
.nav { display: flex; gap: 2px; overflow-x: auto; flex: 1; scrollbar-width: none; }
.nav::-webkit-scrollbar { display: none; }
.nav-a { color: inherit; text-decoration: none; padding: 8px 12px; border-radius: 8px; white-space: nowrap; font-size: 15px; }
.nav-a:hover { background: var(--top-hover); } .nav-a.on { background: var(--top-on); font-weight: 700; }
.topbar .btn.ghost { color: inherit; background: transparent; border-color: currentColor; } .topbar .btn.ghost:hover { background: var(--top-hover); }
.pill { background: #e1ae4c; color: #231a05; border-radius: 999px; padding: 2px 10px; font-size: 12px; font-weight: 800; letter-spacing: .04em; text-transform: uppercase; }
.main { max-width: 1280px; margin: 0 auto; padding: 22px 18px 60px; min-height: 70vh; }
.foot { max-width: 1280px; margin: 0 auto; padding: 18px; display: flex; gap: 16px; flex-wrap: wrap; align-items: center; color: var(--ink2); font-size: 14px; border-top: 1px solid var(--line); }
.linkbtn { background: none; border: 0; padding: 0; font: inherit; color: var(--accent); text-decoration: underline; cursor: pointer; }

/* controls */
.btn { font: inherit; font-size: 15px; cursor: pointer; border-radius: 10px; padding: 9px 16px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); text-decoration: none; display: inline-flex; align-items: center; gap: 6px; min-height: 40px; }
.btn:hover { background: var(--surface2); } .btn:disabled { opacity: .5; cursor: not-allowed; }
.btn.small { padding: 5px 11px; min-height: 32px; font-size: 14px; border-radius: 8px; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 700; } .btn.primary:hover { filter: brightness(1.08); }
.btn.big { padding: 13px 24px; font-size: 17px; }
.btn.on { background: var(--green); color: var(--on-green); border-color: var(--green); }
.btn.danger { color: var(--bad); border-color: var(--bad); }
.btn.file { cursor: pointer; }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin: 10px 0; } .row.end { justify-content: flex-end; } .row.actions { margin: 18px 0; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.seg-btn { font: inherit; font-size: 14px; padding: 7px 13px; background: var(--surface); color: var(--ink); border: 0; border-right: 1px solid var(--line); cursor: pointer; }
.seg-btn:last-child { border-right: 0; } .seg-btn[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); font-weight: 700; }
input, textarea, select { font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; width: 100%; }
textarea { resize: vertical; line-height: 1.5; }
.field { display: block; margin: 0 0 12px; } .field > span { display: block; font-size: 13px; font-weight: 600; margin-bottom: 4px; color: var(--ink2); } .field.inline { display: flex; align-items: center; gap: 8px; margin: 0; flex-wrap: wrap; max-width: 100%; } .field.inline > span { margin: 0; } .field.inline select { width: auto; max-width: 100%; min-width: 0; }
.search input { min-width: 220px; }
.check { display: flex; align-items: center; gap: 8px; margin: 6px 0; } .check input { width: auto; }
.chip { display: inline-block; font-size: 12px; background: var(--surface2); border-radius: 999px; padding: 1px 9px; margin-right: 4px; color: var(--ink2); }
.flag { display: inline-block; font-size: 12px; background: var(--warn-soft); color: var(--warn); border-radius: 6px; padding: 1px 7px; font-weight: 600; } .flag.need { background: var(--bad-soft); color: var(--bad); }
.notice { background: var(--warn-soft); color: var(--ink); border-left: 4px solid var(--warn); border-radius: 6px; padding: 10px 14px; margin: 0 0 16px; }
.status { margin: 8px 0; font-weight: 600; } .hint { color: var(--ink2); font-size: 14px; }
.empty { background: var(--surface); border: 1px dashed var(--line); border-radius: 12px; padding: 30px; text-align: center; }
.warns { background: var(--warn-soft); border-radius: 10px; padding: 12px 16px; margin: 12px 0; } .warns ul { margin: 6px 0; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 18px; margin-bottom: 16px; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; } .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 12px; }
@media (max-width: 800px) { .two, .grid2 { grid-template-columns: 1fr; } .topbar { padding: 0 10px; gap: 8px; } .brand span.logo { display: none; } }

/* home */
.hero { max-width: 760px; margin-bottom: 18px; } .hero p { font-size: 18px; color: var(--ink2); } .privacy { color: var(--ink) !important; font-size: 16px !important; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 12px; margin: 16px 0; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px; text-align: center; } .tile b { display: block; font-size: 28px; color: var(--accent); } .tile span { font-size: 13px; color: var(--ink2); }
.opt { font-size: 12px; font-weight: 600; color: var(--ink2); background: var(--surface2); padding: 2px 8px; border-radius: 999px; vertical-align: middle; }

/* resume view */
.tabs2 { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 16px; border-bottom: 1px solid var(--line); }
.tab2 { font: inherit; background: none; border: 0; border-bottom: 3px solid transparent; padding: 10px 14px; cursor: pointer; color: var(--ink2); }
.tab2[aria-selected="true"] { color: var(--accent); border-bottom-color: var(--accent); font-weight: 700; }
fieldset { border: 1px solid var(--line); border-radius: 12px; margin: 0 0 16px; padding: 14px 16px; background: var(--surface); } legend { font-weight: 800; padding: 0 8px; }
.entry { border: 1px solid var(--line); border-radius: 10px; padding: 12px; margin-bottom: 12px; background: var(--bg); } .entry-head { display: flex; gap: 10px; align-items: center; justify-content: space-between; } .entry-head h4 { margin: 0; flex: 1; }
.sticky-actions { position: sticky; bottom: 0; background: var(--bg); padding: 12px 0; display: flex; gap: 12px; align-items: center; border-top: 1px solid var(--line); z-index: 5; }
.checklist { list-style: none; padding: 0; } .checklist li { display: flex; gap: 12px; padding: 8px 0; border-bottom: 1px solid var(--line); } .checklist p { margin: 2px 0 0; color: var(--ink2); font-size: 14px; }
.lvl { flex: 0 0 52px; font-size: 12px; font-weight: 800; text-transform: uppercase; border-radius: 6px; text-align: center; height: 22px; line-height: 22px; background: var(--surface2); }
.lvl-pass .lvl { background: var(--green-soft); color: var(--green-text); } .lvl-warn .lvl { background: var(--warn-soft); color: var(--warn); } .lvl-fail .lvl { background: var(--bad-soft); color: var(--bad); }
.meter-line { font-size: 18px; margin: 10px 0; }
.sugg { list-style: none; padding: 0; } .sugg li { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; margin-bottom: 10px; } .sugg q { display: block; margin: 6px 0; font-style: italic; } .sugg p { margin: 0; color: var(--ink2); }
.design { display: grid; grid-template-columns: 300px 1fr; gap: 20px; align-items: start; } @media (max-width: 960px) { .design { grid-template-columns: 1fr; } }
.tpls { display: grid; gap: 8px; } .tpl { text-align: left; font: inherit; background: var(--surface); border: 2px solid var(--line); border-radius: 10px; padding: 10px 12px; cursor: pointer; color: var(--ink); display: grid; gap: 2px; } .tpl span { font-size: 13px; color: var(--ink2); } .tpl em { font-size: 12px; color: var(--green-text); font-style: normal; }
.tpl[aria-checked="true"] { border-color: var(--accent); background: var(--accent-soft); }
.design-view { background: var(--surface2); border-radius: 14px; padding: 16px; overflow: auto; }
.paper-wrap { display: flex; justify-content: center; } .paper { background: #fff; color: #111; box-shadow: var(--shadow); zoom: .78; padding: 14mm 16mm; } .paper.a4 { width: 210mm; min-height: 297mm; } .paper.letter { width: 8.5in; min-height: 11in; }
@media (max-width: 1280px) { .paper { zoom: .6; } } @media (max-width: 760px) { .paper { zoom: .42; } }

/* match */
.match-head { display: flex; justify-content: space-between; gap: 16px; align-items: flex-start; flex-wrap: wrap; } .sub { color: var(--ink2); margin: 0; }
.score { text-align: center; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 10px 22px; } .score b { font-size: 36px; color: var(--accent); display: block; } .score span { font-size: 13px; color: var(--ink2); }
.tbl { width: 100%; border-collapse: collapse; } .tbl th, .tbl td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--line); vertical-align: top; font-size: 15px; } .tbl .st-missing td:first-child { color: var(--bad); font-weight: 700; } .tbl .st-shown td strong { color: var(--green-text); } .tbl .st-listed td strong { color: var(--warn); }

/* board */
.focusbar { position: sticky; top: var(--topbar-h); z-index: 30; background: var(--bar); border-bottom: 1px solid var(--line); margin: -22px -18px 18px; padding: 8px 18px; display: flex; gap: 12px; align-items: center; justify-content: space-between; box-shadow: 0 2px 6px rgba(0, 0, 0, .06); }
.fb-main { display: flex; gap: 12px; align-items: center; min-width: 0; } .fb-title { display: flex; flex-direction: column; min-width: 0; } .fb-title strong { font-size: 18px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.fb-kicker { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--ink2); font-weight: 700; }
.rail { position: fixed; right: 10px; top: 50%; transform: translateY(-50%); list-style: none; margin: 0; padding: 8px 4px; display: flex; flex-direction: column; gap: 6px; z-index: 20; } .rail button { width: 12px; height: 12px; padding: 0; border-radius: 50%; border: 2px solid var(--ink2); background: transparent; cursor: pointer; } .rail button.on { background: var(--accent); border-color: var(--accent); transform: scale(1.25); }
.rail button:focus-visible { outline: 3px solid var(--focus); }
@media (max-width: 1100px) { .rail { display: none; } .fb-side .btn { font-size: 12px; padding: 4px 8px; } }
.board-tools { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-bottom: 14px; }
.admin-bar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; margin-bottom: 16px; }
.menu-wrap { position: relative; } .menu { position: absolute; z-index: 35; top: 100%; left: 0; min-width: 220px; max-height: 320px; overflow: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow); padding: 6px; display: grid; } .menu.right { left: auto; right: 0; }
.menu button { font: inherit; text-align: left; background: none; border: 0; padding: 8px 10px; border-radius: 6px; cursor: pointer; color: var(--ink); } .menu button:hover, .menu button:focus-visible { background: var(--surface2); } .menu .newsec { border-top: 1px solid var(--line); font-weight: 700; }
.sec { padding: 18px 0 30px; scroll-margin-top: calc(var(--topbar-h) + 64px); }
.sec-head { display: flex; justify-content: space-between; gap: 16px; align-items: flex-start; margin-bottom: 14px; border-bottom: 2px solid var(--line); padding-bottom: 10px; } .sec-head h2 { margin: 0; font-size: 26px; } .sec-side { display: flex; gap: 12px; align-items: center; }
.ring { position: relative; width: 48px; height: 48px; display: inline-block; } .ring span { position: absolute; inset: 0; border-radius: 50%; background: conic-gradient(var(--green) calc(var(--p) * 1%), var(--line) 0); } .ring b { position: absolute; inset: 5px; border-radius: 50%; background: var(--bg); display: grid; place-items: center; font-size: 11px; }
.cards { display: flex; flex-wrap: wrap; gap: 18px; align-items: flex-start; }
.card { --paper: var(--p-slate); flex: 1 1 320px; max-width: 460px; min-width: 260px; background: var(--paper); color: var(--paper-ink); border-radius: 4px 4px 16px 4px; padding: 14px 16px 12px; box-shadow: var(--shadow); position: relative; transform: rotate(var(--tilt, 0deg)); transition: transform .15s ease, box-shadow .15s ease; }
.card:nth-child(3n+1) { --tilt: -.5deg; } .card:nth-child(3n+2) { --tilt: .4deg; }
.card:hover, .card:focus-within, .card.flash { transform: rotate(0) translateY(-2px); box-shadow: 0 10px 24px rgba(0, 0, 0, .18); }
@media (prefers-reduced-motion: reduce) { .card, .card:hover, .card:focus-within { transition: none; transform: none; } }
.hue-blue { --paper: var(--p-blue); } .hue-yellow { --paper: var(--p-yellow); } .hue-green { --paper: var(--p-green); } .hue-purple { --paper: var(--p-purple); } .hue-orange { --paper: var(--p-orange); } .hue-slate { --paper: var(--p-slate); } .hue-pink { --paper: var(--p-pink); } .hue-teal { --paper: var(--p-teal); }
.card-top { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 6px; } .cat { font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: .08em; opacity: .75; }
.card .chip { background: rgba(0, 0, 0, .08); color: inherit; } .card .muted { color: inherit; opacity: .7; }
.card .q { font-size: 17px; margin: 0 0 8px; font-weight: 700; } .card .a { font-size: 15px; overflow-wrap: anywhere; }
.card-meta { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; font-size: 12px; margin-top: 10px; }
.card-actions { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; padding-top: 8px; border-top: 1px dashed rgba(0, 0, 0, .25); opacity: 0; transition: opacity .12s; }
.card:hover .card-actions, .card:focus-within .card-actions, .card.selected .card-actions, .card.flash .card-actions { opacity: 1; }
@media (pointer: coarse) { .card-actions { opacity: 1; } }
.card .btn { background: rgba(255, 255, 255, .7); color: #1d2428; border-color: rgba(0, 0, 0, .25); } :root[data-theme="dark"] .card .btn, :root:not([data-theme="light"]) .card .btn { }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .card .btn { background: rgba(0, 0, 0, .35); color: #eef1f2; border-color: rgba(255, 255, 255, .3); } }
:root[data-theme="dark"] .card .btn { background: rgba(0, 0, 0, .35); color: #eef1f2; border-color: rgba(255, 255, 255, .3); }
.card .btn.on { background: var(--green); color: var(--on-green); }
.sel { display: inline-flex; align-items: center; gap: 4px; font-size: 13px; margin-right: 4px; } .sel input { width: auto; }
.card.selected { outline: 3px solid var(--accent); }
.card.flash { outline: 3px solid var(--focus); outline-offset: 3px; }
.card.perfected { --paper: var(--surface); background: var(--surface); border: 2px solid var(--green); border-left-width: 8px; border-radius: 6px; transform: none; box-shadow: none; }
.card.perfected:hover, .card.perfected:focus-within { transform: none; }
.badge-done { margin-left: auto; display: inline-flex; align-items: center; gap: 4px; background: var(--green); color: var(--on-green); font-size: 12px; font-weight: 800; padding: 2px 9px; border-radius: 999px; }
.archived { margin-top: 24px; } .archived summary { cursor: pointer; font-weight: 700; margin-bottom: 12px; }
.pr-card { max-width: 760px; margin: 18px auto; transform: none; } .pr-card:hover { transform: none; } .timer { margin-left: auto; font-variant-numeric: tabular-nums; font-weight: 700; } .timer.over { color: var(--bad); }

/* editor */
.edit-top { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; margin-bottom: 14px; }
.edit-grid { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(280px, 1fr); gap: 22px; align-items: start; } @media (max-width: 900px) { .edit-grid { grid-template-columns: 1fr; } }
.edit .q { font-size: 28px; padding: 16px 18px; background: var(--paper); color: var(--paper-ink); border-radius: 4px 4px 16px 4px; margin-bottom: 16px; }
.edit textarea#answer { min-height: 280px; font-size: 17px; line-height: 1.6; }

function parseDate(str, asEnd, now) {

  const today = now || new Date();

// Resume text -> structured record. Rule based: headings, date ranges, bullets. Imperfect by nature, so every result

const HEADINGS = [
  ['summary', /^(?:professional |career |executive |personal )?(?:summary|profile|about(?: me)?|objective|overview)$/i],
  ['experience', /^(?:(?:work|professional|relevant|employment|career) )?(?:experience|history)$|^employment(?: history)?$|^work history$|^professional experience$/i],
  ['personal', /^(?:personal|side|independent|open[- ]source|self[- ]directed|hobby) projects?$/i],
  ['projects', /^(?:key |selected |academic |technical |notable )?projects?$/i],
  ['skills', /^(?:(?:technical|key|core|professional) )?skills(?: (?:&|and) (?:tools|technologies))?$|^(?:tools|technologies|tech stack|core competencies|tools (?:&|and) technologies)$/i],

  const email = (EMAIL_RE.exec(text) || [''])[0];
  const phone = (topLines.join(' ').match(PHONE_RE) || [''])[0].trim();
  const links = (text.match(/(?:https?:\/\/)?(?:www\.)?(?:linkedin\.com|github\.com|gitlab\.com|behance\.net|medium\.com)\/[^\s,;|)]+/gi) || []);
  let name = '';
  for (const l of topLines) {
    const t = norm(l);
    if (!t || EMAIL_RE.test(t) || /\d/.test(t) || /https?:|www\./i.test(t)) continue;
    if (/^[A-Za-z][A-Za-z.'’-]*(?: [A-Za-z][A-Za-z.'’-]*){1,3}$/.test(t) && !ROLE_RE.test(t)) { name = t; break; }
  }
  const headline = (() => { for (const l of topLines) { const t = norm(l); if (t && t !== name && ROLE_RE.test(t) && t.length <= 80 && !EMAIL_RE.test(t) && !/\d{4}/.test(t)) return t; } return ''; })();
  const loc = (() => { for (const l of topLines) for (const p of norm(l).split(/\s*\|\s*|\s+[\u2022\u00b7]\s+/).map(norm)) if (LOCATION_RE.test(p) && !ROLE_RE.test(p) && p !== name && !EMAIL_RE.test(p)) return p; return ''; })();
  return { name, headline, email, phone, location: loc, links: links.map((x) => x.replace(/[.)]+$/, '')) };
}

function parseResume(text, now) {
  const raw = String(text || '').replace(/\r\n?/g, '\n');
  const lines = raw.split('\n').map((l) => l.replace(/\s+$/, ''));
  const secs = splitSections(lines);
  const warnings = [];
  const get = (k) => secs.filter((s) => s.kind === k);
  const top = (secs[0] && secs[0].lines) || [];
  const contact = parseContact(top.filter((l) => norm(l)).slice(0, 8), lines);

  let summary = get('summary').map((s) => toBullets(s.lines).join(' ')).join(' ').trim();
  if (!summary) {
    const para = toBullets(top.slice(1)).filter((l) => l.split(/\s+/).length >= 18).join(' ');
    summary = para;
  }

  let experience = [];
  SKIP_LINES = new Set([contact.name, contact.headline].filter(Boolean).map(norm));
  get('experience').forEach((s) => { experience = experience.concat(parseExperience(s.lines, now)); });
  // Some resumes have no "Experience" heading: look for dated entries in the loose text instead.
  if (!experience.length && !get('experience').length) experience = parseExperience(top, now);
  SKIP_LINES = new Set();
  const projects = []; get('projects').forEach((s) => projects.push(...parseProjects(s.lines, 'project')));
  const personal = []; get('personal').forEach((s) => personal.push(...parseProjects(s.lines, 'personal')));
  const skillSec = get('skills'); const sk = parseSkills([].concat(...skillSec.map((s) => s.lines)));
  const education = [].concat(...get('education').map((s) => toBullets(s.lines)));
  const certifications = [].concat(...get('certifications').map((s) => toBullets(s.lines)));
  const achievements = [].concat(...get('achievements').map((s) => toBullets(s.lines)));

  if (!experience.length) warnings.push('No jobs with dates were found. Check that each job has a date range such as "Mar 2021 - Present".');
  experience.forEach((e) => { if (e.confidence === 'low') warnings.push('Check the company, role and dates for the entry "' + (e.company || e.role || 'unnamed') + '".'); });
  if (!contact.name) warnings.push('No name was found at the top.');
  if (!contact.email) warnings.push('No email address was found.');
  if (!sk.items.length) warnings.push('No skills section was found.');

  // Total experience in years (first start to last end, ignoring overlaps).
  let years = 0;
  const starts = experience.map((e) => e._start).filter(Boolean);
  const ends = experience.map((e) => e._end).filter(Boolean);
  if (starts.length && ends.length) {
    const first = starts.reduce((a, b) => (a.y * 12 + a.m < b.y * 12 + b.m ? a : b));
    const last = ends.reduce((a, b) => (a.y * 12 + a.m > b.y * 12 + b.m ? a : b));
    years = Math.max(0, Math.round(monthsBetween(first, last) / 12 * 10) / 10);
  }
  experience.forEach((e) => { delete e._start; delete e._end; });
  // Dates are recomputed from the visible strings when needed (see datesOf in questions.js).

  return {
    contact, summary, experience, projects, personal, skills: sk.items, skillGroups: sk.groups,
    education, certifications, achievements, years, warnings,
    foundAt: Date.now(),
  };
}

/** Plain text of a structured resume (used for JD matching and the ATS keyword checks). */
function resumeText(r) {
  if (!r) return '';
  const out = [r.contact && r.contact.name, r.contact && r.contact.headline, r.summary];
  (r.experience || []).forEach((e) => { out.push(e.role, e.company, ...(e.bullets || [])); });
  (r.projects || []).concat(r.personal || []).forEach((p) => { out.push(p.name, p.tech, ...(p.bullets || [])); });
  out.push((r.skills || []).join(', '), ...(r.education || []), ...(r.certifications || []), ...(r.achievements || []));
  return out.filter(Boolean).join('\n');
}

// Job description analysis and resume-to-JD matching. Rule based: a skills dictionary with synonyms, section cues
// ("Requirements", "Nice to have") and a few patterns for years, seniority, company and contact details.


// id, label, group, synonyms (matched as whole words, case-insensitive)
const SKILLS = [
  ['sql', 'SQL', 'Data', ['sql', 't-sql', 'tsql', 'pl/sql', 'mysql', 'postgresql', 'postgres']],
  ['python', 'Python', 'Data', ['python', 'pandas', 'numpy']],
  ['r', 'R', 'Data', ['r programming', 'rstudio', 'r language', 'tidyverse', 'python or r', 'r or python']],
  ['excel', 'Excel', 'Tools', ['excel', 'spreadsheets', 'vba', 'google sheets']],
  ['powerbi', 'Power BI', 'BI', ['power bi', 'powerbi', 'dax', 'power query']],
  ['tableau', 'Tableau', 'BI', ['tableau']],
  ['looker', 'Looker', 'BI', ['looker', 'looker studio', 'data studio']],
  ['dashboards', 'Dashboards and reporting', 'BI', ['dashboard', 'dashboards', 'reporting', 'reports', 'visualisation', 'visualization', 'data visualisation', 'data visualization']],
  ['snowflake', 'Snowflake', 'Warehouse', ['snowflake']],
  ['bigquery', 'BigQuery', 'Warehouse', ['bigquery', 'big query']],
  ['redshift', 'Redshift', 'Warehouse', ['redshift']],
  ['warehouse', 'Cloud data warehouse', 'Warehouse', ['data warehouse', 'cloud data warehouse', 'warehouse', 'data warehousing', 'synapse', 'databricks']],
  ['dbt', 'dbt', 'Engineering', ['dbt']],
  ['etl', 'ETL / data pipelines', 'Engineering', ['etl', 'elt', 'data pipeline', 'data pipelines', 'airflow', 'data modelling', 'data modeling', 'ssis', 'azure data factory']],
  ['git', 'Git', 'Engineering', ['git', 'github', 'version control']],
  ['cloud', 'Cloud (AWS, Azure, GCP)', 'Engineering', ['aws', 'azure', 'gcp', 'google cloud']],
  ['abtesting', 'A/B testing and experiments', 'Analysis', ['a/b test', 'a/b testing', 'ab testing', 'experiment', 'experiments', 'experimentation', 'experiment design']],
  ['stats', 'Statistics', 'Analysis', ['statistics', 'statistical', 'hypothesis testing', 'regression', 'probability']],
  ['forecasting', 'Forecasting', 'Analysis', ['forecast', 'forecasting', 'demand modelling', 'demand modeling', 'time series', 'predictive']],
  ['ml', 'Machine learning', 'Analysis', ['machine learning', 'scikit-learn', 'sklearn', 'predictive modelling']],
  ['geospatial', 'Geospatial data', 'Analysis', ['geospatial', 'gis', 'spatial data']],
  ['kpi', 'KPIs and metrics', 'Analysis', ['kpi', 'kpis', 'metrics', 'okr']],
  ['quality', 'Data quality and testing', 'Engineering', ['data quality', 'well-tested', 'testing', 'validation', 'data governance']],
  ['stakeholders', 'Stakeholder management', 'People', ['stakeholder', 'stakeholders', 'senior stakeholders', 'cross-functional', 'business partners']],
  ['communication', 'Communication and storytelling', 'People', ['communication', 'storytelling', 'present findings', 'presentation', 'presenting', 'communicate']],
  ['mentoring', 'Mentoring and leadership', 'People', ['mentor', 'mentoring', 'coach', 'coaching', 'lead a team', 'team lead', 'line management', 'leadership']],
  ['agile', 'Agile ways of working', 'People', ['agile', 'scrum', 'kanban', 'jira']],
  ['product', 'Product analytics', 'Analysis', ['product analytics', 'product team', 'product managers', 'funnel', 'retention']],
];

const NICE_HEAD = /^(?:nice to have|preferred|bonus|desirable|a plus|nice-to-have|plus|good to have|would be a plus|advantageous)/i;
const REQ_HEAD = /^(?:requirements?|what you(?:'|’)ll need|what we(?:'|’)re looking for|must have|essential|you have|qualifications|skills and experience|about you|who you are|key skills)/i;
const RESP_HEAD = /^(?:responsibilities|what you(?:'|’)ll do|the role|key responsibilities|duties|your role|day to day|in this role)/i;

function re(syn) { return new RegExp('(?<![A-Za-z0-9+#])' + syn.replace(/[.*+?^${}()|[\]\\]/g, '\\$&').replace(/\s+/g, '\\s+') + '(?![A-Za-z0-9+#])', 'i'); }
const SKILL_RES = SKILLS.map(([id, label, group, syns]) => ({ id, label, group, res: syns.map(re) }));
const skillById = (id) => SKILLS.find((s) => s[0] === id);
const skillLabel = (id) => (skillById(id) || [id, id])[1];

function skillsIn(text) {
  const t = String(text || '');
  return SKILL_RES.filter((s) => s.res.some((r) => r.test(t))).map((s) => s.id);
}

function headingOf(line) {
  const t = norm(line).replace(/[:\-*#]+$/g, '').trim();
  if (!t || t.length > 60 || /[.!?]$/.test(t)) return null;
  if (NICE_HEAD.test(t)) return 'nice';
  if (REQ_HEAD.test(t)) return 'req';
  if (RESP_HEAD.test(t)) return 'resp';
  return null;
}

function analyseJd(text) {
  const raw = String(text || '').replace(/\r\n?/g, '\n');
  const lines = raw.split('\n').map((l) => l.replace(/\s+$/, ''));
  const nonEmpty = lines.filter((l) => norm(l));
  const title = norm(nonEmpty[0] || '').replace(/^job title\s*[:-]\s*/i, '');

  const emails = [...new Set(raw.match(/[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}/g) || [])];
  const phones = [...new Set((raw.match(/(?:\+\d{1,3}[\s.-]?)?\(?\d{2,5}\)?[\s.-]\d{3,5}[\s.-]?\d{3,5}/g) || []).map(norm))];
  const links = [...new Set(raw.match(/https?:\/\/[^\s)]+/g) || [])];

  let company = '';
  let m = /^\s*(?:company|employer|organisation|organization)\s*[:\-]\s*(.+)$/im.exec(raw);
  if (m) company = norm(m[1]);
  if (!company) { m = /^\s*about\s+(?:us\s*[:\-]?\s*)?(.{2,50}?)\s*$/im.exec(raw); if (m && !/^(?:us|the role|you|the team)$/i.test(m[1])) company = norm(m[1]); }
  if (!company && nonEmpty[1] && norm(nonEmpty[1]).length <= 50 && !/[:.]$/.test(norm(nonEmpty[1])) && !/location|salary|contract/i.test(nonEmpty[1])) company = norm(nonEmpty[1]);
  if (!company) { m = /\bat\s+([A-Z][A-Za-z0-9&' -]{2,40})(?:[,.\s]|$)/.exec(raw); if (m) company = norm(m[1]); }

  const loc = (/^\s*location\s*[:\-]\s*(.+)$/im.exec(raw) || [])[1] || '';
  const yearsM = /(\d{1,2})\s*\+?\s*(?:-\s*\d{1,2}\s*)?years?/i.exec(raw);
  const years = yearsM ? +yearsM[1] : 0;
  const hay = (title + ' ' + raw.slice(0, 400)).toLowerCase();
  const seniority = /\b(principal|head of|director)\b/.test(hay) ? 'lead' : /\b(lead|staff)\b/.test(hay) ? 'lead' : /\bsenior|sr\.?\b/.test(hay) ? 'senior' : /\b(junior|graduate|entry)\b/.test(hay) ? 'junior' : years >= 6 ? 'senior' : years >= 3 ? 'mid' : 'mid';

  // Walk the lines tracking which block we are in, so skills under "Nice to have" count as optional.
  let mode = 'other';
  const required = new Set(), nice = new Set(), responsibilities = [], reqLines = [], groups = [];
  for (const l of lines) {
    const h = headingOf(l);
    if (h) { mode = h; continue; }
    const t = norm(l);
    if (!t) continue;
    if (/^(?:about|to apply|how to apply|benefits|what we offer|salary)\b/i.test(t) && !isBullet(l)) mode = 'other';
    const found = skillsIn(t);
    if (found.length > 1 && /\b(?:or|such as|e\.g\.)\b|\//i.test(t)) groups.push(found);
    if (mode === 'nice') found.forEach((id) => nice.add(id));
    else found.forEach((id) => required.add(id));
    if (mode === 'resp' && isBullet(l)) responsibilities.push(stripBullet(l));
    if (mode === 'req' && isBullet(l)) reqLines.push(stripBullet(l));
  }
  nice.forEach((id) => { if (required.has(id)) nice.delete(id); });
  // Skills only mentioned in the "about" paragraph are weak signals; keep the ones found in a responsibilities or requirements line.
  const strong = new Set();
  [...responsibilities, ...reqLines].forEach((l) => skillsIn(l).forEach((id) => strong.add(id)));
  const req = [...required].filter((id) => strong.has(id) || !strong.size);

  const themes = [];
  if (seniority === 'senior' || seniority === 'lead') themes.push('Ownership and judgement: can you run an area of analysis without close direction?');
  if (req.includes('stakeholders') || req.includes('communication')) themes.push('Influence: can you explain findings and change a senior person’s mind?');
  if (req.includes('mentoring')) themes.push('Leadership: have you raised the level of other people’s work?');
  if (req.includes('abtesting') || req.includes('stats')) themes.push('Rigour: do you design and read experiments correctly?');
  if (req.includes('sql') || req.includes('warehouse')) themes.push('Technical depth: writing clear, correct, tested SQL on a real warehouse.');
  if (req.includes('dashboards') || req.includes('powerbi') || req.includes('tableau')) themes.push('Product thinking: dashboards people actually use, not just build.');

  return { title, company, location: norm(loc), emails, phones, links, years, seniority, required: req, nice: [...nice], responsibilities, themes, groups };
}

/** Which JD skills does the resume show, and where? */
function matchJd(jd, resume) {
  const rows = [];
  const bulletsOf = [];
  (resume.experience || []).forEach((e) => (e.bullets || []).forEach((b) => bulletsOf.push({ where: (e.role || 'Role') + ' at ' + (e.company || 'company'), text: b })));
  (resume.projects || []).concat(resume.personal || []).forEach((p) => (p.bullets || []).forEach((b) => bulletsOf.push({ where: p.name, text: b })));
  const skillsText = (resume.skills || []).join(', ') + ' ' + (resume.summary || '');
  const add = (id, optional) => {
    const entry = SKILL_RES.find((s) => s.id === id); if (!entry) return;
    const inSkills = entry.res.some((r) => r.test(skillsText));
    const evidence = bulletsOf.filter((b) => entry.res.some((r) => r.test(b.text))).slice(0, 3);
    const status = evidence.length ? 'shown' : inSkills ? 'listed' : 'missing';
    rows.push({ id, label: entry.label, optional: !!optional, status, evidence });
  };
  jd.required.forEach((id) => add(id, false));
  jd.nice.forEach((id) => add(id, true));
  // "Snowflake or BigQuery": one of them is enough, so a missing alternative is not a gap.
  (jd.groups || []).forEach((g) => {
    const members = rows.filter((r) => g.includes(r.id));
    if (members.length < 2) return;
    const best = members.find((r) => r.status === 'shown') || members.find((r) => r.status === 'listed');
    if (best) members.forEach((r) => { if (r !== best && r.status === 'missing') { r.status = 'alt'; r.altOf = best.label; } });
  });
  const req = rows.filter((r) => !r.optional && r.status !== 'alt');
  const score = req.length ? Math.round(req.reduce((n, r) => n + (r.status === 'shown' ? 1 : r.status === 'listed' ? 0.6 : 0), 0) / req.length * 100) : null;
  const resumeSkills = skillsIn(resumeText(resume));
  const extras = resumeSkills.filter((id) => !jd.required.includes(id) && !jd.nice.includes(id)).map(skillLabel);
  const suggestions = [];
  rows.forEach((r) => {
    if (r.status === 'missing' && !r.optional) suggestions.push('The role asks for ' + r.label + ' and your resume does not show it. If you have used it, add it to a bullet with what you did and the result. If not, prepare an honest answer about how you would learn it.');
    else if (r.status === 'listed') suggestions.push(r.label + ' is only in your skills list. Add it to a bullet so the reader can see where you used it.');
  });
  if (jd.years && resume.years && resume.years < jd.years) suggestions.push('The role asks for ' + jd.years + '+ years and your resume shows about ' + resume.years + '. Be ready to explain how your depth makes up for it.');
  return { rows, score, extras, suggestions };
}

// Resume readability checks: what an automated parser or a quick human skim will trip on. These are rules of thumb,
// not a real ATS score, and the UI says so.


const WEAK = [
  [/\bresponsible for\b/i, 'Replace "responsible for" with what you did: "Owned", "Ran", "Built".'],
  [/\bworked (?:on|with)\b/i, '"Worked on" hides your part. Say what you did and what changed.'],
  [/\bhelped (?:with|to)?\b/i, '"Helped" understates your role. Name your contribution.'],
  [/\bduties (?:include|included)\b/i, 'List results, not duties.'],
  [/\bassisted (?:with|in)\b/i, '"Assisted" reads as a minor role. Say what you delivered.'],
  [/\bsupported\b/i, '"Supported" is vague. Say what you produced or improved.'],
];
const ACTION = /^(?:built|led|ran|drove|wrote|made|cut|grew|won|set up|designed|developed|created|launched|delivered|automated|reduced|increased|improved|owned|managed|analysed|analyzed|presented|forecast|mentored|migrated|implemented|introduced|streamlined|negotiated|defined|established|trained|identified|combined|visualised|visualized|published|cleaned|prepared|replaced|raised|scaled|rebuilt|produced|partnered|collaborated|coordinated|reviewed|tested|optimised|optimized|simplified|standardised|standardized|transformed|supported|helped|worked|used|maintained)\b/i;
const HAS_NUMBER = /\d|%|£|\$|€|₹/;

/** A safe one-phrase rewrite for the most common weak opening. Anything else is left for the user. */
function rewriteBullet(b) {
  const t = String(b || '');
  const m = /^(?:responsible for|duties (?:include|included)|in charge of)\s+(.*)$/i.exec(t);
  return m && m[1] ? 'Owned ' + m[1].charAt(0).toLowerCase() + m[1].slice(1) : null;
}

function checkResume(r, rawText) {
  const items = [];
  const add = (id, area, level, title, detail) => items.push({ id, area, level, title, detail });
  const c = r.contact || {};
  const bullets = [];
  (r.experience || []).forEach((e, i) => (e.bullets || []).forEach((b, line) => bullets.push({ b, where: e.company || e.role || 'a job', ref: { kind: 'job', i, line } })));
  (r.projects || []).forEach((p, i) => (p.bullets || []).forEach((b, line) => bullets.push({ b, where: p.name, ref: { kind: 'project', i, line } })));
  (r.personal || []).forEach((p, i) => (p.bullets || []).forEach((b, line) => bullets.push({ b, where: p.name, ref: { kind: 'personal', i, line } })));
  const text = rawText || resumeText(r);
  const wc = wordCount(text);

  // Contact
  add('email', 'Contact', c.email ? 'pass' : 'fail', c.email ? 'Email address found' : 'No email address', c.email ? '' : 'Recruiters and ATS forms look for an email near the top.');
  add('phone', 'Contact', c.phone ? 'pass' : 'warn', c.phone ? 'Phone number found' : 'No phone number', c.phone ? '' : 'Add a phone number unless you prefer email only.');
  add('links', 'Contact', (c.links || []).length ? 'pass' : 'info', (c.links || []).length ? 'Profile link found' : 'No LinkedIn or portfolio link', (c.links || []).length ? '' : 'A LinkedIn or GitHub link helps for analyst and engineering roles.');
  if (/\b(date of birth|dob|marital status|nationality|passport)\b/i.test(text)) add('personal', 'Contact', 'warn', 'Personal details that are usually left out', 'Date of birth, marital status and nationality are usually omitted for US, UK and EU roles. Keep them only if the employer asks.');

  // Structure
  add('summary', 'Structure', r.summary ? 'pass' : 'warn', r.summary ? 'Summary found' : 'No summary', r.summary ? '' : 'Two or three lines at the top say who you are and what you offer.');
  add('experience', 'Structure', (r.experience || []).length ? 'pass' : 'fail', (r.experience || []).length ? (r.experience.length + ' jobs with dates found') : 'No dated jobs found', (r.experience || []).length ? '' : 'Use a clear job header with a date range for each role.');
  add('skills', 'Structure', (r.skills || []).length >= 6 ? 'pass' : (r.skills || []).length ? 'warn' : 'fail', (r.skills || []).length ? (r.skills.length + ' skills listed') : 'No skills section', (r.skills || []).length >= 6 ? '' : 'List at least six relevant tools and methods so keyword searches can find you.');
  add('education', 'Structure', (r.education || []).length ? 'pass' : 'warn', (r.education || []).length ? 'Education found' : 'No education section', '');

  // Dates and gaps
  const jobs = r.experience || [];
  const bad = jobs.filter((e) => !parseDate(e.start) || !parseDate(e.end, true));
  add('dates', 'Dates', !jobs.length ? 'info' : bad.length ? 'warn' : 'pass', bad.length ? bad.length + ' job(s) with unclear dates' : 'Dates are readable', bad.length ? 'Use "Mon YYYY - Mon YYYY" for every role.' : '');
  const gaps = [];
  const dated = jobs.map((e) => ({ e, s: parseDate(e.start), t: parseDate(e.end, true) })).filter((x) => x.s && x.t).sort((a, b) => (a.s.y * 12 + a.s.m) - (b.s.y * 12 + b.s.m));
  for (let i = 1; i < dated.length; i++) { const g = monthsBetween(dated[i - 1].t, dated[i].s); if (g > 6) gaps.push((dated[i - 1].e.company || 'job') + ' to ' + (dated[i].e.company || 'job') + ' (' + g + ' months)'); }
  add('gaps', 'Dates', gaps.length ? 'info' : 'pass', gaps.length ? 'Gap between jobs: ' + gaps.join('; ') : 'No gaps over six months', gaps.length ? 'Gaps are normal. Add a one-line reason if it was study, caring, travel or freelance work.' : '');

  // Bullets
  const long = bullets.filter((x) => wordCount(x.b) > 38);
  const withNum = bullets.filter((x) => HAS_NUMBER.test(x.b));
  const withAction = bullets.filter((x) => ACTION.test(x.b));
  const share = bullets.length ? withNum.length / bullets.length : 0;
  add('metrics', 'Impact', !bullets.length ? 'info' : share >= 0.4 ? 'pass' : share >= 0.2 ? 'warn' : 'fail', bullets.length ? withNum.length + ' of ' + bullets.length + ' bullets include a number' : 'No bullets found', share >= 0.4 ? '' : 'Aim for a number in at least four bullets in ten: money, time, volume, accuracy or people affected.');
  add('verbs', 'Impact', !bullets.length ? 'info' : withAction.length / bullets.length >= 0.7 ? 'pass' : 'warn', bullets.length ? withAction.length + ' of ' + bullets.length + ' bullets start with an action verb' : '', 'Start each bullet with what you did: Built, Led, Cut, Automated.');
  add('long', 'Impact', long.length ? 'warn' : 'pass', long.length ? long.length + ' bullet(s) are long' : 'Bullets are a good length', long.length ? 'Keep bullets under about two lines. Split long ones into action and result.' : '');
  const jobBullets = jobs.map((e) => (e.bullets || []).length);
  add('depth', 'Impact', jobs.length && jobBullets.some((n) => n < 2) ? 'warn' : 'pass', jobs.length && jobBullets.some((n) => n < 2) ? 'A job has fewer than two bullets' : 'Each job has enough detail', '');

  // Wording
  const weak = [];
  bullets.forEach((x) => WEAK.forEach(([rx, tip]) => { if (rx.test(x.b)) weak.push({ where: x.where, bullet: x.b, tip, ref: x.ref }); }));
  add('weak', 'Wording', weak.length ? 'warn' : 'pass', weak.length ? weak.length + ' bullet(s) use weak phrasing' : 'No weak phrasing found', weak.length ? 'See the suggestions list for each one.' : '');
  const first = bullets.filter((x) => /\b(I|my)\b/.test(x.b));
  add('pronouns', 'Wording', first.length ? 'warn' : 'pass', first.length ? first.length + ' bullet(s) use "I" or "my"' : 'No first-person pronouns', first.length ? 'Resume bullets usually drop "I" and start with the verb.' : '');
  add('length', 'Length', wc < 250 ? 'warn' : wc > 1000 ? 'warn' : 'pass', wc + ' words', wc < 250 ? 'Short for a senior resume. Add detail on results.' : wc > 1000 ? 'Long. Two pages is usually the limit.' : '');
  add('chars', 'Format', /[─-╿�■-◿]/.test(text.replace(/[▪●◦■○]/g, '')) ? 'warn' : 'pass', 'Characters', 'Avoid boxes, icons and decorative characters. Parsers may drop them or turn them into noise.');

  const suggestions = [];
  weak.forEach((w) => suggestions.push({ kind: 'wording', where: w.where, text: w.tip, bullet: w.bullet, ref: w.ref, rewrite: rewriteBullet(w.bullet) }));
  bullets.filter((x) => !HAS_NUMBER.test(x.b)).slice(0, 8).forEach((x) => suggestions.push({ kind: 'metric', where: x.where, text: 'Add a number or result: how many, how much, how often, or what changed?', bullet: x.b, ref: x.ref }));
  long.slice(0, 4).forEach((x) => suggestions.push({ kind: 'length', where: x.where, text: 'Shorten to one idea: the action, then the result.', bullet: x.b, ref: x.ref }));

  const counts = items.reduce((a, i) => { a[i.level] = (a[i.level] || 0) + 1; return a; }, {});
  const scored = items.filter((i) => i.level !== 'info');
  return { items, suggestions, passed: scored.filter((i) => i.level === 'pass').length, total: scored.length, counts };
}

// Quick, explainable checks on a typed answer: length, structure, ownership, numbers and hedging.

const HEDGES = /\b(maybe|kind of|sort of|i think|i guess|probably|just|a bit|somewhat|hopefully|i suppose|basically|actually|honestly)\b/gi;
const RESULT = /\b(result(?:ed)?|led to|so that|which (?:meant|saved|raised|cut|reduced|increased)|saved|reduced|increased|improved|cut|grew|raised|delivered|outcome|impact|as a result|adopted)\b/i;
const ACT_RX = /\b(i (?:built|led|ran|wrote|designed|created|decided|proposed|analysed|analyzed|presented|set up|automated|negotiated|investigated|fixed|owned|introduced|worked|asked|spoke|chose|tested|delivered|made))\b/i;
const SITUATION = /\b(when|at the time|we were|the team was|the problem|the challenge|there was|our|the business|context|situation|needed to|had to)\b/i;
const TASK = /\b(my (?:job|role|task|goal|responsibility)|i was (?:asked|responsible|tasked)|i needed to|i had to|the goal)\b/i;

function analyseAnswer(text, targetSeconds) {
  const t = String(text || '');
  const wc = wordCount(t);
  const sec = speakSeconds(t);
  const we = (t.match(/\bwe\b/gi) || []).length, i = (t.match(/\bI\b/g) || []).length;
  const hedges = (t.match(HEDGES) || []).length;
  const hasNumber = /\d|%/.test(t.replace(/\[add:[^\]]*\]/gi, ''));
  const gaps = (t.match(/\[add:[^\]]*\]/gi) || []).length;
  const star = { situation: SITUATION.test(t), task: TASK.test(t), action: ACT_RX.test(t), result: RESULT.test(t) };
  const checks = [
    { id: 'gaps', ok: gaps === 0 && wc > 0, text: gaps ? gaps + ' gap(s) still marked [add: ...]' : 'No unfilled gaps' },
    { id: 'length', ok: !targetSeconds || (sec >= targetSeconds * 0.5 && sec <= targetSeconds * 1.4), text: targetSeconds ? 'Speaking time about ' + sec + ' s (target ' + targetSeconds + ' s)' : 'Speaking time about ' + sec + ' s' },
    { id: 'result', ok: star.result, text: star.result ? 'Names a result' : 'No clear result yet' },
    { id: 'number', ok: hasNumber, text: hasNumber ? 'Includes a number' : 'No number yet' },
    { id: 'owner', ok: i >= we || we === 0, text: i >= we ? 'Clear about what you did' : 'Many "we": say what you did' },
    { id: 'hedge', ok: hedges <= 1, text: hedges > 1 ? hedges + ' hedging words (' + (t.match(HEDGES) || []).slice(0, 3).join(', ') + ')' : 'Confident wording' },
  ];
  return { words: wc, seconds: sec, star, checks, gaps };
}

const GENERIC_COACH = { test: 'Can you answer clearly, with an example, in a reasonable time?', include: ['A direct first sentence', 'One example', 'A result or lesson'], avoid: ['Rambling', 'No example'], followups: ['Can you give another example?'], seconds: 75 };

function coachFor(card) {
  if (!card) return GENERIC_COACH;
  if (card.source === 'collected') return COLLECTED_COACH[card.topic] || GENERIC_COACH;
  return COACH[card.tid] || GENERIC_COACH;
}

// ---------- helpers ----------
const PAST = /^(?:built|led|ran|drove|wrote|made|cut|grew|won|set up|took|brought|began|got|gave|found|taught|spoke|held|kept|sold|saw|put|chose|rebuilt|\w+ed)\b/i;
const article = (w) => (/^[aeiou]/i.test(w) ? 'an ' : 'a ') + w;
const periodOf = (e) => [e.start, e.end].filter(Boolean).join(' to ');
const clean = (s) => norm(s).replace(/[.;:]+$/, '');
/** "Built a dashboard..." -> "I built a dashboard..."; otherwise quote the bullet so the sentence still reads. */
function sayBullet(b) {
  const t = clean(b);
  if (!t) return '';
  return PAST.test(t) ? 'I ' + lcFirst(t) : 'one thing I did was this: "' + trunc(t, 140) + '"';
}
const hasNum = (s) => /\d|%/.test(s);
function topBullets(bullets, n) {
  return (bullets || []).map((b, i) => ({ b, i, score: (hasNum(b) ? 100 : 0) + Math.min(b.length, 120) / 2 - i })).sort((a, b) => b.score - a.score).slice(0, n).sort((a, b) => a.i - b.i).map((x) => x.b);
}
const label = (e) => e.company || e.role || 'this job';
const jobKey = (e) => 'co:' + slug(e.company) + '-' + slug(e.role);

function endOf(e) { return parseDate(e.end, true); }
function latestJob(r) {
  const jobs = (r.experience || []).slice();
  jobs.sort((a, b) => { const x = endOf(a), y = endOf(b); return (y ? y.y * 12 + y.m : 0) - (x ? x.y * 12 + x.m : 0); });
  return jobs[0] || null;
}
function topSkills(r, n) { return (r.skills || []).slice(0, n).join(', '); }
function isCurrent(e) { return /present|current|now/i.test(e.end || ''); }

// ---------- resume cards ----------
function buildResumeCards(r) {
  const out = [];
  const add = (sec, tid, cat, key, q, a) => out.push({ key, sec, cat, tid, q, a, seconds: (COACH[tid] || GENERIC_COACH).seconds });
  const jobs = r.experience || [];
  const latest = latestJob(r);
  const name = (r.contact && r.contact.name) || '';

  // Start here
  const S1 = { key: 'intro', title: 'Start here', kind: 'resume', order: 10 };
  const prior = jobs.filter((e) => e !== latest)[0];
  const proof = latest ? topBullets(latest.bullets, 1)[0] : '';
  const proof2 = prior ? topBullets(prior.bullets, 1)[0] : '';
  const who = (r.contact && r.contact.headline) || (latest && latest.role) || GAP('your job title');
  const yrs = r.years ? 'about ' + Math.round(r.years) + ' years' : GAP('number of years');
  const sk = topSkills(r, 3) || GAP('your three main skills');
  add(S1, 'yourself', 'intro', 'intro:yourself', 'Tell me about yourself.',
    'I am ' + article(who) + ' with ' + yrs + ' of experience in ' + sk + '. ' +
    (latest && proof ? 'Most recently at ' + label(latest) + ', ' + sayBullet(proof) + '. ' : '') +
    (prior && proof2 ? 'Before that, at ' + label(prior) + ', ' + sayBullet(proof2) + '. ' : '') +
    GAP('one line on what you are best known for') + ' ' +
    'I am now looking for a role where I can ' + GAP('what you want to do next') + '.');
  add(S1, 'walkthrough', 'intro', 'intro:walkthrough', 'Walk me through your resume.',
    jobs.length ? jobs.slice().reverse().map((e) => 'At ' + label(e) + ' (' + periodOf(e) + ') I worked as ' + (e.role ? article(e.role) : GAP('role')) + '. ' + (topBullets(e.bullets, 1)[0] ? sayBullet(topBullets(e.bullets, 1)[0]) + '. ' : '') + GAP('why you moved on, or what you learned')).join('\n\n')
      : GAP('one line per job: what you did and why you moved'));
  add(S1, 'looking', 'intro', 'intro:looking', 'Why are you looking for a new role?',
    latest ? 'I have learned a lot at ' + label(latest) + ', in particular ' + GAP('one thing you learned') + '. ' + GAP('the positive reason you want to move: scope, learning, domain') + '. This role looks like the right next step because ' + GAP('link to the job') + '.' : GAP('a positive reason'));

  // Common questions
  const S2 = { key: 'general', title: 'Common questions', kind: 'resume', order: 20 };
  const bestAch = latest ? topBullets(latest.bullets, 1)[0] : '';
  add(S2, 'strengths', 'general', 'gen:strengths', 'What are your strengths?', 'My strengths are ' + GAP('strength 1') + ' and ' + GAP('strength 2') + '. For example, ' + (bestAch ? sayBullet(bestAch) : GAP('a short example')) + '.');
  add(S2, 'weakness', 'general', 'gen:weakness', 'What is your biggest weakness?', 'I have found that ' + GAP('a real, small weakness') + '. To work on it I ' + GAP('what you do about it') + ', and ' + GAP('a sign that it is improving') + '.');
  add(S2, 'achievement', 'general', 'gen:proud', 'What achievement are you most proud of?',
    bestAch ? 'The thing I am proudest of is this. ' + GAP('the situation and goal') + '. ' + sayBullet(bestAch) + '. ' + GAP('what you personally did that others might not have') + '. ' + GAP('the result, with a number if you have one') : GAP('situation, what you did, result'));
  add(S2, 'conflict', 'general', 'gen:conflict', 'Tell me about a time you disagreed with a colleague or manager.', 'The situation was ' + GAP('what the disagreement was about') + '. I ' + GAP('how you listened and what you proposed') + '. The outcome was ' + GAP('result and relationship afterwards') + '.');
  add(S2, 'failure', 'general', 'gen:failure', 'Tell me about a time you made a mistake.', 'I ' + GAP('the mistake, in one sentence') + '. I told ' + GAP('who and when') + ' and fixed it by ' + GAP('what you did') + '. Since then I ' + GAP('what you changed') + '.');
  add(S2, 'pressure', 'general', 'gen:deadline', 'How do you handle tight deadlines and competing priorities?', 'I start by ' + GAP('how you decide what matters most') + '. An example was ' + GAP('a real deadline') + ', where I ' + GAP('what you did and who you told') + '.');
  add(S2, 'influence', 'general', 'gen:influence', 'Tell me about a time you changed someone’s mind with data.', 'The decision was ' + GAP('the decision') + '. I showed ' + GAP('the evidence you used') + ', and when ' + GAP('the push-back') + ', I ' + GAP('how you handled it') + '. The result was ' + GAP('outcome') + '.');
  add(S2, 'salary', 'general', 'gen:salary', 'What are your salary expectations?', 'I would like to understand the full role first. Based on my research for ' + GAP('role and location') + ', I am looking at ' + GAP('your researched range') + ', and I am flexible depending on the whole package.');
  add(S2, 'notice', 'general', 'gen:notice', 'What is your notice period?', 'My notice period is ' + GAP('your notice period') + '. I would hand over ' + GAP('what you would hand over') + ' properly before leaving.');
  add(S2, 'ask', 'general', 'gen:ask', 'What questions do you have for us?', '1. How is success measured for this role in the first year?\n2. ' + GAP('a question about the team or data') + '\n3. ' + GAP('a question about the business problem you would work on'));

  // One section per job
  jobs.forEach((e, i) => {
    const S = { key: jobKey(e), title: (e.role || 'Role') + ' at ' + label(e), sub: periodOf(e), kind: 'resume', order: 30 + i };
    const bl = e.bullets || [];
    const tb = topBullets(bl, 2);
    add(S, 'roleOverview', 'role', S.key + ':overview', 'Tell me about your role at ' + label(e) + '.',
      'At ' + label(e) + ' I was ' + (e.role ? article(e.role) : GAP('your role')) + ' from ' + periodOf(e) + '. ' + tb.map((b) => sayBullet(b) + '.').join(' ') + ' ' + GAP('team size and who you worked with'));
    const ach = topBullets(bl.filter(hasNum), 1)[0] || topBullets(bl, 1)[0];
    add(S, 'achievement', 'role', S.key + ':achievement', 'What was your biggest achievement at ' + label(e) + '?',
      GAP('situation: what was wrong or needed') + ' ' + (ach ? sayBullet(ach) + '.' : GAP('what you did')) + ' ' + GAP('the result, with a number if you have one') + ' ' + GAP('why it mattered to the business'));
    add(S, 'challenge', 'role', S.key + ':challenge', 'What was the hardest problem you solved at ' + label(e) + '?',
      'The problem was ' + GAP('the problem and why it was hard') + '. I considered ' + GAP('two options') + ' and chose ' + GAP('which and why') + '. ' + GAP('the result and what you learned'));
    const used = skillsIn(bl.join(' ')).map(skillLabel);
    add(S, 'tools', 'role', S.key + ':tools', 'Which tools and methods did you use at ' + label(e) + ', and why?',
      used.length ? 'I mainly used ' + used.join(', ') + '. ' + GAP('what each was used for and why you chose it') : GAP('the tools you used and why'));
    add(S, 'stakeholders', 'role', S.key + ':stakeholders', 'Who did you work with at ' + label(e) + ' and how did you handle requests?',
      'I worked with ' + GAP('teams and seniority') + '. When a request came in, I ' + GAP('how you clarified the need and agreed scope') + '. I reported back by ' + GAP('how and how often') + '.');
    tb.forEach((b) => add(S, 'deepdive', 'role', S.key + ':b-' + hash(b), 'You wrote: “' + trunc(clean(b), 150) + '”. Walk me through how you did that.',

/* ---- core/practice.js ---- */
// Practice helpers: key facts in an answer, fading an answer for recall drills, spaced review dates,
// "what to prepare first" ranking, mock interview picking, and the resume facts that fit a card.



const DAY = 864e5;
const INTERVAL_DAYS = [0, 1, 3, 7, 14, 30];

/** Numbers with units, tools and proper names: the facts a good answer should hit. */
function keyFacts(text) {
  const t = String(text || '').replace(/\[add:[^\]]*\]/gi, ' ');
  const out = [];
  const add = (s) => { s = norm(s); if (s && !out.some((x) => x.toLowerCase() === s.toLowerCase())) out.push(s); };
  (t.match(/[£$€₹]?\d[\d,.]*\s?(?:%|k|m|bn|x|hours?|days?|weeks?|months?|years?|stores?|people|users?|managers?|reports?|tables?|minutes?)?/gi) || []).forEach((m) => { if (/\d/.test(m) && m.trim().length > 0) add(m); });
  skillsIn(t).forEach((id) => add(skillLabel(id)));
  (t.match(/\b[A-Z][a-z]+(?:\s[A-Z][a-z]+)+\b/g) || []).forEach((m) => { if (!/^(?:I|My|The|At|Before|Most|After|Since)\b/.test(m)) add(m); });
  return out.slice(0, 8);
}

/** Splits an answer into words that can be hidden. level: 0 full, 1 cues, 2 first words, 3 blank. */
function fadeTokens(text, level) {
  const facts = keyFacts(text).map((f) => f.toLowerCase());
  const parts = String(text || '').split(/(\s+)/);
  let sentenceStart = true; let wi = 0;
  return parts.map((p) => {
    if (!p) return { t: p, hide: false };
    if (/^\s+$/.test(p)) return { t: p, hide: false, space: true };
    const bare = p.replace(/^[^\w£$€₹[]+|[^\w%\]]+$/g, '').toLowerCase();
    const isGap = /^\[add:|\]$/.test(p) || /^\[add/.test(p);
    const isFact = facts.some((f) => f.split(/\s+/).includes(bare) || bare === f) || /\d/.test(p);
    const first = sentenceStart; sentenceStart = /[.!?]["')]*$/.test(p);
    const h = parseInt(hash(String(wi++) + p), 36) % 100;
    let hide = false;
    if (level === 1) hide = !isFact && !isGap && !first && h < 45;
    else if (level === 2) hide = !isFact && !isGap && !first;
    else if (level >= 3) hide = true;
    return { t: p, hide };
  });
}

// ---------- spaced review ----------
function scheduleReview(prev, ok, now) {
  now = now || Date.now();
  const box = ok ? Math.min(((prev && prev.box) || 0) + 1, INTERVAL_DAYS.length - 1) : 0;
  return { n: ((prev && prev.n) || 0) + 1, last: now, ok: !!ok, box, due: now + (ok ? INTERVAL_DAYS[box] * DAY : 10 * 60000) };
}
function isDue(card, now) {
  now = now || Date.now();
  if (!card.practice) return true;
  return now >= (card.practice.due !== undefined ? card.practice.due : card.practice.last + 7 * DAY);
}
function dueCount(cards, now) { return cards.filter((c) => norm(c.a) && isDue(c, now)).length; }

// ---------- what to prepare first ----------
const FIRST = ['intro:yourself', 'gen:proud', 'intro:looking', 'gen:weakness', 'gen:strengths'];
function priorityCards(cards, max) {
  const open = cards.filter((c) => c.status !== 'perfected' && !c.archived);
  const score = (c) => {
    const i = FIRST.indexOf(c.key); if (i >= 0) return 100 - i;
    if (c.source === 'jd' && /why-company|why-role/.test(c.key)) return 90;
    if (c.source === 'jd' && /skill-/.test(c.key) && c.tid === 'skillGap') return 85;
    if (c.tid === 'achievement' && c.cat === 'role') return 70;
    if (c.tid === 'roleOverview') return 60;
    if (c.tid === 'projEnd') return 55;
    if (c.cat === 'story') return 50;
    return 10;
  };
  return open.map((c) => ({ c, s: score(c) })).filter((x) => x.s >= 50).sort((a, b) => b.s - a.s || (a.c.seq || 0) - (b.c.seq || 0)).slice(0, max || 6).map((x) => x.c);
}

// ---------- mock interview ----------
function buildMock(cards, minutes, rand) {
  rand = rand || Math.random;
  const pool = cards.filter((c) => !c.archived && norm(c.q));
  const pick = (fn, n) => { const a = pool.filter(fn).sort(() => rand() - 0.5); return a.slice(0, n); };
  const seq = [];
  const intro = pool.find((c) => c.key === 'intro:yourself'); if (intro) seq.push(intro);
  const per = minutes <= 20 ? 1 : minutes <= 30 ? 2 : 3;
  seq.push(...pick((c) => c.cat === 'role' && c.tid !== 'leaving', per + 1));
  seq.push(...pick((c) => c.cat === 'project' || c.cat === 'personal', Math.max(1, per - 1)));
  seq.push(...pick((c) => c.cat === 'jd' && c.tid !== 'ask', per));
  seq.push(...pick((c) => c.cat === 'general' && !['salary', 'notice', 'ask'].includes(c.tid), per));
  seq.push(...pick((c) => c.cat === 'collected', Math.max(0, per - 1)));
  const ask = pool.find((c) => c.tid === 'ask' && c.source === 'jd') || pool.find((c) => c.tid === 'ask'); if (ask) seq.push(ask);
  const seen = new Set(); const out = seq.filter((c) => !seen.has(c.id) && seen.add(c.id));
  // trim to the time: about the target seconds per answer plus 20 s of listening
  let total = 0; const fit = [];
  for (const c of out) { const t = (c.seconds || 75) + 20; if (total + t > minutes * 60 && fit.length >= 3) break; fit.push(c); total += t; }
  return fit;
}

// ---------- facts from the resume that fit a card ----------
function factsFor(card, resume, jdRows) {
  if (!resume || !card) return [];
  const out = [];
  const slug = (s) => String(s || '').toLowerCase().replace(/&/g, ' and ').replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 40) || 'x';
  const key = card.key || '';
  const job = (resume.experience || []).find((e) => key.startsWith('co:' + slug(e.company) + '-' + slug(e.role) + ':'));
  const proj = (resume.projects || []).concat(resume.personal || []).find((p) => key.startsWith('pr:' + slug(p.name) + ':') || key.startsWith('pp:' + slug(p.name) + ':'));
  const add = (label, text) => { if (norm(text) && !out.some((o) => o.text === text)) out.push({ label, text, say: sayBullet(text) }); };
  if (job) (job.bullets || []).forEach((b) => add((job.role || 'Role') + ' at ' + (job.company || ''), b));
  else if (proj) (proj.bullets || []).forEach((b) => add(proj.name, b));
  else if (card.source === 'jd') {
    (jdRows || []).forEach((r) => (r.evidence || []).forEach((e) => add(e.where, e.text)));
    (resume.experience || []).slice(0, 1).forEach((e) => topBullets(e.bullets, 2).forEach((b) => add((e.role || '') + ' at ' + (e.company || ''), b)));
  } else {
    (resume.experience || []).slice(0, 3).forEach((e) => topBullets(e.bullets, 2).forEach((b) => add((e.role || '') + ' at ' + (e.company || ''), b)));
  }
  return out.slice(0, 12);
}

/* ---- core/extract.js ---- */
// Pulls interview questions (and answers, when present) out of pasted text: notes, emails, forum threads, documents.
// Rule based and deliberately forgiving. Each item carries a confidence so the UI can flag splits worth checking.

const QWORD = /^(?:what|why|how|when|where|who|which|whom|whose|can you|could you|would you|will you|have you|has the|do you|does|did you|are you|is there|is it|was there|should)\b/i;
const IMPERATIVE = /^(?:tell me|explain|describe|walk me through|give me|give an example|write (?:a|an|the)|compare|differentiate|define|discuss|talk (?:me )?through|talk about|share (?:an|a)|list|name (?:a|an|the|some)|outline|illustrate|demonstrate|justify)\b/i;
const Q_MARK = /^\s*(?:q(?:uestion)?\s*\d*\s*[:.)\-]|\d{1,3}\s*[.)]\s*(?:q(?:uestion)?\s*[:.)-])?)\s*/i;
const A_MARK = /^\s*(?:a(?:ns(?:wer)?)?\s*\d*\s*[:.)\-])\s*/i;

function isQuestionLine(raw) {
  const t = norm(stripBullet(raw).replace(Q_MARK, ''));
  if (!t || t.length > 320) return null;
  if (/[?]\s*[)"'”]*$/.test(t)) return { text: t, strong: true };
  if (IMPERATIVE.test(t) && t.length <= 240) return { text: t, strong: false };
  // A numbered or bulleted short line starting with a question word, even without a question mark.
  if ((isBullet(raw) || /^\s*\d{1,3}[.)]/.test(raw)) && QWORD.test(t) && t.length <= 200) return { text: t, strong: false };
  return null;
}

function extractQA(text) {
  const lines = String(text || '').replace(/\r\n?/g, '\n').split('\n');
  const items = [];
  let cur = null; let inCode = false;
  let prevBlank = true;
  const flush = () => { if (cur) { cur.lines = cur.a.length; cur.a = cur.a.join('\n').replace(/\n{3,}/g, '\n\n').trim(); items.push(cur); cur = null; } };
  for (let i = 0; i < lines.length; i++) {
    const raw = lines[i];
    if (/^\s*```/.test(raw)) { inCode = !inCode; if (cur) cur.a.push(raw); continue; }
    if (inCode) { if (cur) cur.a.push(raw); continue; }
    const t = norm(raw);
    if (!t) { if (cur && cur.a.length) cur.a.push(''); prevBlank = true; continue; }
    const wasBlank = prevBlank; prevBlank = false;
    const explicitA = A_MARK.test(raw) && cur;
    if (explicitA) { cur.a.push(norm(raw.replace(A_MARK, ''))); continue; }
    const explicitQ = Q_MARK.test(raw) && /^\s*q/i.test(raw);
    const qLine = isQuestionLine(raw);
    // Inside an answer, only a clear marker or a real question line starts a new question.
    if (qLine && (qLine.strong || explicitQ || wasBlank || !cur || !cur.a.length || /^\s*(?:\d{1,3}[.)]|[•*-])\s/.test(raw))) {
      flush();
      let q = qLine.text;
      // A question wrapped onto the next line: current line has no end mark, next starts lowercase.
      while (i + 1 < lines.length && !/[?.]$/.test(q) && /^\s*[a-z(]/.test(lines[i + 1]) && norm(lines[i + 1]).length < 160 && !isQuestionLine(lines[i + 1])) { q += ' ' + norm(lines[i + 1]); i++; }
      cur = { q, a: [], confidence: qLine.strong || explicitQ ? 'high' : 'low' };
      continue;
    }
    if (cur) cur.a.push(isBullet(raw) ? '- ' + stripBullet(raw) : t);
  }
  flush();
  return items.map((it) => ({ q: it.q, a: it.a, confidence: it.confidence === 'high' && it.lines < 40 ? 'high' : 'low' })).filter((it) => it.q.length >= 8);
}

function matches(c) {

// ---------- focus bar and auto-fit scrolling ----------
let scrollBound = false, snapTimer = null, lastY = 0, dir = 0, programmatic = false, pointerDown = false, progTimer = null;
const reduced = () => window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
function offsetTop() {
  const h = document.querySelector('.topbar'), f = document.getElementById('focusbar');
  return (h ? h.getBoundingClientRect().height : 0) + (f ? f.getBoundingClientRect().height : 0) + 6;
}
function secEls() { return Array.prototype.slice.call(document.querySelectorAll('.board .sec')); }
function geometry() {
  const off = offsetTop(); const vh = window.innerHeight;
  return secEls().map((el) => { const r = el.getBoundingClientRect(); return { el, top: r.top, bottom: r.bottom, h: r.height, off, vh }; });
}
function updateFocus() {
  const g = geometry(); if (!g.length) return;
  const off = g[0].off;
  let cur = g[0];
  for (const x of g) if (x.top <= off + 40) cur = x;
  const name = document.getElementById('fb-name'); if (!name) return;
  const title = cur.el.querySelector('h2').textContent;
  if (name.textContent !== title) name.textContent = title;
  const idx = g.indexOf(cur);
  const cnt = document.getElementById('fb-count'); if (cnt) cnt.textContent = 'Section ' + (idx + 1) + ' of ' + g.length;
  document.querySelectorAll('.rail button').forEach((b, i) => { b.classList.toggle('on', i === idx); b.setAttribute('aria-current', i === idx ? 'true' : 'false'); });
  document.documentElement.style.setProperty('--board-offset', off + 'px');
  return { cur, idx, g };
}
function scrollToY(y) {
  programmatic = true; clearTimeout(progTimer);
  window.scrollTo({ top: Math.max(0, y), behavior: reduced() ? 'auto' : 'smooth' });
  progTimer = setTimeout(() => { programmatic = false; }, reduced() ? 120 : 700);
}
function scrollToSection(i) {
  const g = geometry(); if (!g[i]) return;
  scrollToY(window.scrollY + g[i].top - g[i].off);
}
function stepSection(delta) {
  const f = updateFocus(); if (!f) return;
  const i = Math.max(0, Math.min(f.g.length - 1, f.idx + delta));
  // If the current section is partly above the bar, "previous" first returns to its own top.
  if (delta < 0 && f.cur.top < f.cur.off - 30) return scrollToSection(f.idx);
  scrollToSection(i);
}
/** Snap rule: when the section above is >= 90% out of view, align the new section; going up, do the mirror image.
 * A section taller than the screen is only aligned at its top and then scrolls freely. */
function maybeSnap() {
  if (!S.ui.autofit || programmatic || pointerDown || UI.route !== 'board') return;
  const g = geometry(); if (g.length < 2) return;
  const off = g[0].off, vh = window.innerHeight;
  if (dir > 0) {
    // the first section whose top is on screen below the bar: if the one above it has almost left, bring it to the top
    for (let j = 1; j < g.length; j++) {
      const prev = g[j - 1], cur = g[j];
      if (cur.top > off + 24 && cur.top < vh - 40) {
        const prevVisible = Math.max(0, Math.min(prev.bottom, vh) - Math.max(prev.top, off));
        if (prevVisible <= prev.h * 0.1) scrollToY(window.scrollY + cur.top - off);
        return;
      }
    }
  } else if (dir < 0) {
    // going up: a section that starts above the bar, with the next one almost gone below, is shown whole if it fits
    for (let j = 0; j < g.length - 1; j++) {
      const cur = g[j], next = g[j + 1];
      if (cur.top < off - 24 && cur.bottom > off + 4) {
        const nextVisible = Math.max(0, Math.min(next.bottom, vh) - Math.max(next.top, off));
        if (nextVisible <= next.h * 0.1 && cur.h <= vh - off) scrollToY(window.scrollY + cur.top - off);
        return;
      }
    }
  }
}
function onScroll() {
  const y = window.scrollY; if (y !== lastY) dir = y > lastY ? 1 : -1; lastY = y;
  if (UI.route !== 'board') return;
  updateFocus();
  clearTimeout(snapTimer); snapTimer = setTimeout(maybeSnap, 160);
}
function bindBoardScroll() {
  lastY = window.scrollY; dir = 0;
  if (scrollBound) return;
  scrollBound = true;
  window.addEventListener('scroll', onScroll, { passive: true });
  window.addEventListener('resize', () => { if (UI.route === 'board') updateFocus(); });
  window.addEventListener('pointerdown', () => { pointerDown = true; }, { passive: true });
  const up = () => { if (pointerDown) { pointerDown = false; clearTimeout(snapTimer); snapTimer = setTimeout(maybeSnap, 160); } };
  window.addEventListener('pointerup', up, { passive: true }); window.addEventListener('pointercancel', up, { passive: true });
}
function flashCard(id) {
  const el = document.querySelector('[data-card="' + CSS.escape(id) + '"]'); if (!el) return false;
  const off = offsetTop();
  window.scrollTo({ top: Math.max(0, window.scrollY + el.getBoundingClientRect().top - off - 12), behavior: 'auto' });
  el.classList.add('flash'); try { el.focus({ preventScroll: true }); } catch (e) { /* ignore */ }
  setTimeout(() => el.classList.remove('flash'), 2200);
  return true;
}

const HUE_OF = { intro: 'blue', role: 'yellow', project: 'green', personal: 'purple', story: 'orange', general: 'slate', jd: 'pink', collected: 'teal' };

// ---------- Practice ----------
const LEVELS = [['Full text', 0], ['Some words hidden', 1], ['First words only', 2], ['From memory', 3]];
function newPractice() { return { scope: 'due', mode: 'drill', minutes: 30, level: 3, deck: null, i: 0, reveal: false, t0: 0, spoken: 0, results: [], hits: {}, deadline: 0 }; }
function fmtClock(sec) { sec = Math.max(0, Math.round(sec)); return Math.floor(sec / 60) + ':' + String(sec % 60).padStart(2, '0'); }
function renderPractice() {
  const p = UI.practice || (UI.practice = newPractice());
  if (!p.deck) return practiceHome(p);
  if (p.i >= p.deck.length) return practiceSummary(p);
  return practiceCard(p);
}
function practiceHome(p) {
  const rd = readiness(); const secs = sectionsInOrder();
  const deckSize = practiceDeck(p.scope).length;
  return '<section class="practice"><div class="pr-intro"><h2>Practise out loud</h2><p class="hint">Answering aloud is what makes an answer stick. Pick a drill, or run a timed mock interview.</p></div>' +
    '<div class="tiles"><div class="tile"><b>' + rd.due + '</b><span>answers due for review</span></div><div class="tile"><b>' + rd.perfected + '</b><span>perfected answers</span></div><div class="tile"><b>' + rd.gaps + '</b><span>answers with gaps to fill</span></div></div>' +
    '<div class="two"><div class="panel"><h3>Drill</h3><p class="hint">Question first. Say your answer, then show yours and tick the facts you hit. Right answers come back after 1, 3, 7, 14 and 30 days. A miss comes back within minutes.</p>' +
    '<label class="field"><span>What to practise</span><select id="pr-scope" data-action="pr-scope">' + [['due', 'Answers due for review'], ['draft', 'Answers that need work'], ['perfected', 'Perfected answers'], ['all', 'Everything']].map(([v, l]) => '<option value="' + v + '"' + (p.scope === v ? ' selected' : '') + '>' + l + '</option>').join('') + secs.map((x) => '<option value="' + esc(x.s.id) + '"' + (p.scope === x.s.id ? ' selected' : '') + '>' + esc(x.s.title) + '</option>').join('') + '</select></label>' +
    '<label class="field"><span>How much do you want to see while you answer?</span><select id="pr-level" data-action="pr-level">' + LEVELS.map(([l, v]) => '<option value="' + v + '"' + (p.level === v ? ' selected' : '') + '>' + l + '</option>').join('') + '</select></label>' +
    '<p class="muted">' + deckSize + ' question' + (deckSize === 1 ? '' : 's') + ' match. A round is up to 25.</p>' +
    '<button class="btn primary big" data-action="pr-start"' + (deckSize ? '' : ' disabled') + '>Start the drill</button>' + (!deckSize && p.scope === 'due' ? '<p class="hint">Nothing is due. Fill in the gaps in a few answers on the <a href="#/board">cards</a> first, or choose another group.</p>' : '') + '</div>' +
    '<div class="panel"><h3>Mock interview</h3><p class="hint">A timed run in interview order: your opening answer, questions on your jobs and projects, the job, then a question for them. No hints. Cards that still have gaps are included, so fix those first.</p>' +
    '<div class="seg" role="group" aria-label="Length">' + [20, 30, 45].map((m) => '<button class="seg-btn" data-action="pr-minutes" data-v="' + m + '" aria-pressed="' + (p.minutes === m) + '">' + m + ' min</button>').join('') + '</div>' +
    '<div class="row"><button class="btn primary big" data-action="pr-mock">Start the mock interview</button></div></div></div></section>';
}
function practiceCard(p) {
  const c = getCard(p.deck[p.i]);
  if (!c) { p.i++; return renderPractice(); }
  const coach = coachFor(c); const target = coach.seconds || c.seconds;
  const mock = p.mode === 'mock';
  const facts = keyFacts(c.a);
  const hit = p.hits[c.id] || [];
  let body = '';
  if (!p.reveal) {
    if (!mock && p.level > 0 && norm(c.a)) {
      const toks = fadeTokens(c.a, p.level);
      body += '<div class="fade" aria-label="Your answer with some words hidden">' + (p.level >= 3 ? '<p class="muted">Answer from memory. Press Show when you have finished.</p>' : toks.map((t) => t.hide ? '<span class="blank" aria-hidden="true">' + ' '.repeat(Math.min(Math.max(t.t.length, 3), 12)) + '</span>' : esc(t.t).replace(/\n/g, '<br>')).join('')) + '</div>';
    } else if (!mock && p.level === 0 && norm(c.a)) body += '<div class="a">' + markGaps(c.a) + '</div>';
    else if (!mock) body += '<p class="muted">You have not written an answer for this one yet. Say what you would say, then open the editor.</p>';
    else body += '<p class="muted">The interviewer is waiting. Answer out loud.</p>';
    body += (mock ? '' : '<div class="seg" role="group" aria-label="How much to see">' + LEVELS.map(([l, v]) => '<button class="seg-btn" data-action="pr-level-now" data-v="' + v + '" aria-pressed="' + (p.level === v) + '">' + l + '</button>').join('') + '</div>') +
      '<div class="row"><button class="btn primary big" data-action="pr-reveal">' + (mock ? 'Done: show my answer' : 'Show my answer') + ' <kbd>Space</kbd></button><button class="btn" data-action="pr-skip">Skip <kbd>S</kbd></button></div>';
  } else {
    body += '<p class="stat">You took <b>' + fmtClock(p.spoken) + '</b>. Aim for about <b>' + fmtClock(target) + '</b>' + (p.spoken > target * 1.4 ? ': a bit long, tighten it.' : p.spoken < target * 0.5 ? ': short, add the result.' : '.') + '</p>' +
