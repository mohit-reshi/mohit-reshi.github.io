name: CI

on:
  pull_request:
  push:
    branches-ignore: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  site:
    name: Site (validate, test, build, leak check)
    runs-on: ubuntu-latest
    env:
      SITE_SAMPLES: "1"          # build the sample content too so every code path is exercised
      LIVE_BROKER_URL: "mock:"   # tests never call the real broker
      BLOCKLIST: ${{ secrets.BLOCKLIST }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            site/package-lock.json
            tools/validate/package-lock.json
            tools/media/package-lock.json
            live-lab/package-lock.json
      - name: Install
        run: |
          npm --prefix tools/validate ci
          npm --prefix tools/media ci
          npm --prefix live-lab ci
          npm --prefix site ci
      - name: Validate content (schema, tags, media report)
        run: npm --prefix site run validate -- --media
      - name: Tool tests (validate, scaffold, leak check, contrast)
        run: npm --prefix tools/validate test
      - name: Contrast check (design tokens)
        run: npm --prefix site run contrast
      - name: Generate derived files (media manifest, Live Lab data)
        run: npm --prefix site run sync
      - name: Type check (astro check)
        env: { NODE_OPTIONS: "--max-old-space-size=4096" }   # the checker ran out of the default 2 GB heap once the layouts were added
        run: npm --prefix site run check
      - name: Unit tests
        run: npm --prefix site test
      - name: Build Live Lab module
        run: npm --prefix live-lab run build
      - name: Build site
        run: npm --prefix site run build
      - name: Leak check (built site + content)
        run: |
          if [ -z "$BLOCKLIST" ]; then
            echo "::warning::BLOCKLIST secret is not available (fork PR?). Term check skipped; generic ID checks still run."
            node tools/validate/leak-check.mjs
          else
            node tools/validate/leak-check.mjs --require
          fi
      - name: Upload dist for the browser job
        uses: actions/upload-artifact@v4
        with: { name: site-dist, path: site/dist, retention-days: 3 }

  browser:
    name: Browser tests (functional + accessibility)
    needs: site
    runs-on: ubuntu-latest
    env:
      SITE_SAMPLES: "1"
      LIVE_BROKER_URL: "mock:"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: "site/package-lock.json" }
      # The e2e tests rebuild the site and scaffold projects, which run tools/site and tools/validate scripts
      - run: npm --prefix tools/validate ci
      - run: npm --prefix site ci
      - uses: actions/download-artifact@v4
        with: { name: site-dist, path: site/dist }
      - run: npx playwright install --with-deps chromium
        working-directory: site
      - run: npm run e2e
        working-directory: site
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-report, path: site/test-results, retention-days: 3 }

  live-lab:
    name: Live Lab, Worker and tools
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            live-lab/package-lock.json
            live-lab/worker/package-lock.json
            tools/media/package-lock.json
      - run: npm --prefix live-lab ci && npm --prefix live-lab test && npm --prefix live-lab run build
      - run: npm --prefix live-lab/worker ci && npm --prefix live-lab/worker run typecheck && npm --prefix live-lab/worker test
      - run: npm --prefix tools/export-pages test
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: npm --prefix tools/media ci && npm --prefix tools/media test
      - run: node tools/media/src/check-sizes.mjs --root .
      - run: npm --prefix live-lab run secret-scan

  gitleaks:
    name: Secret scan (full history)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }   # this repository's history becomes public: scan all of it
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  history-leak:
    name: Blocklist scan (repo and full history)
    runs-on: ubuntu-latest
    env:
      BLOCKLIST: ${{ secrets.BLOCKLIST }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: |
          if [ -z "$BLOCKLIST" ]; then
            echo "::warning::BLOCKLIST secret is not available (fork PR?). History term check skipped."
            exit 0
          fi
          node tools/validate/leak-check.mjs --repo --history --require
